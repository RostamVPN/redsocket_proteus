[package]
name = "e2e-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "In-process end-to-end test harness for redsocket-http"
publish = false

[dependencies]
redsocket-http = { path = "../.." }
anyhow = "1"
futures = "0.3"
serde_json = "1"
snow = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.13"
